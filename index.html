<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Tarjeta Personal</title>
</head>

<body>
    <div class="container">
        <button type="button" class="btn btn-primary">Buen Perfil</button>
        <button type="button" class="btn btn-success">Regular Perfil</button>
        <button type="button" class="btn btn-danger">Mal Perfil</button>


        <div class="container text-center">
            <div class="row align-items-end">
                <div class="col">
                    <p class="text-start">Izquierda</p>
                </div>
                <div class="col">
                    <p class="text-center text-danger">Centro</p>
                </div>
                <div class="col">
                    <p class="text-end">Derecha</p>
                </div>
            </div>
        </div>


        <div class="card text-bg-secondary" style="width: 18rem;">
            <h5 class="card-title text-center">Mi Perfil</h5>
            <img src="imgcard.jpg" class="card-img-top" alt="Avatar">
            <div class="card-body">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item text-bg-secondary">Nombre: Yesid Hernandez</li>
                    <li class="list-group-item text-bg-secondary">Ciudad: Bogota</li>
                    <li class="list-group-item text-bg-secondary">Hobby: Ver Series de Tv</li>
                </ul>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
